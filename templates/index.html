<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa Gasoil & Naftas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem 1.2rem; background: #1e293b; border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    nav a { color: #94a3b8; text-decoration: none; margin-left: 1.2rem; font-size: .9rem; }
    nav a:hover, nav a.active { color: #38bdf8; }
    .main { flex: 1; display: flex; overflow: hidden; }
    #map { flex: 1; background: #0f172a; }
    .sidebar {
      width: 340px; background: #1e293b; border-left: 1px solid #334155;
      overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
    }
    .panel { background: #0f172a; border-radius: 8px; padding: .9rem; border: 1px solid #334155; }
    .panel h3 { font-size: .85rem; color: #94a3b8; margin-bottom: .6rem; text-transform: uppercase; letter-spacing: .04em; }
    label { font-size: .8rem; color: #94a3b8; display: block; margin-bottom: .25rem; }
    select, input[type=number] {
      width: 100%; padding: .4rem .5rem; border-radius: 6px; border: 1px solid #475569;
      background: #1e293b; color: #e2e8f0; font-size: .85rem; margin-bottom: .5rem;
    }
    .chk-group { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chk-group label { display: flex; align-items: center; gap: .3rem; font-size: .8rem; color: #cbd5e1; cursor: pointer; }

    /* Desplegable multi-seleccion. El panel se expande en el flujo (no flotante)
       porque el sidebar tiene overflow-y:auto y recortaria un panel absoluto. */
    .ms { margin-bottom: .6rem; }
    .ms-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: .4rem; padding: .4rem .5rem; border-radius: 6px; border: 1px solid #475569;
      background: #1e293b; color: #e2e8f0; font-size: .85rem; font-family: inherit;
      cursor: pointer; text-align: left;
    }
    .ms-btn:hover { border-color: #64748b; }
    .ms.abierto .ms-btn { border-color: #0ea5e9; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .ms-sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-sum.parcial { color: #fbbf24; }
    .ms-sum.vacio { color: #f87171; }
    .ms-car { color: #94a3b8; font-size: .7rem; flex-shrink: 0; }
    .ms.abierto .ms-car { transform: rotate(180deg); }
    .ms-panel {
      border: 1px solid #0ea5e9; border-top: none;
      border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
      background: #0f172a; padding: .4rem;
    }
    .ms-panel[hidden] { display: none; }
    .ms-acts { display: flex; gap: .3rem; margin-bottom: .35rem; }
    .ms-acts button {
      flex: 1; padding: .25rem; border: 1px solid #334155; border-radius: 4px;
      background: #1e293b; color: #94a3b8; font-size: .7rem; font-family: inherit; cursor: pointer;
    }
    .ms-acts button:hover { background: #334155; color: #e2e8f0; }
    .ms-list { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: .1rem; }
    .ms-list label {
      display: flex; align-items: center; gap: .4rem; margin: 0; padding: .2rem .3rem;
      font-size: .8rem; color: #cbd5e1; cursor: pointer; border-radius: 4px;
    }
    .ms-list label:hover { background: #1e293b; }
    .ms-vacio { font-size: .72rem; color: #64748b; padding: .3rem; }
    button.apply {
      width: 100%; padding: .55rem; border: none; border-radius: 6px;
      background: #0ea5e9; color: #fff; font-weight: 600; cursor: pointer; font-size: .9rem;
    }
    button.apply:hover { background: #0284c7; }
    .stat { font-size: 1.4rem; font-weight: 700; color: #38bdf8; }
    .stat-label { font-size: .75rem; color: #94a3b8; }
    .prov-detail { display: none; }
    .prov-detail.visible { display: block; }
    .bar { height: 8px; border-radius: 4px; background: #334155; margin-top: .3rem; overflow: hidden; }
    .bar-fill { height: 100%; background: #0ea5e9; border-radius: 4px; }
    .legend { display: flex; flex-direction: column; gap: .25rem; font-size: .75rem; }
    .legend-item { display: flex; align-items: center; gap: .4rem; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }

    /* Tooltip de provincia con desglose por producto */
    .leaflet-tooltip.prov-tip {
      background: #0f172a; border: 1px solid #475569; color: #e2e8f0;
      border-radius: 6px; padding: .5rem .6rem; box-shadow: 0 4px 14px rgba(0,0,0,.5);
      font-family: inherit;
    }
    .leaflet-tooltip.prov-tip:before { border-top-color: #475569; }
    .tip-title { font-weight: 700; font-size: .85rem; margin-bottom: .1rem; }
    .tip-total { font-size: .75rem; color: #94a3b8; margin-bottom: .4rem; }
    .tip-row { display: grid; grid-template-columns: 2.4rem 1fr 3.4rem 2.6rem; gap: .4rem;
               align-items: center; font-size: .75rem; line-height: 1.6; }
    .tip-name { color: #cbd5e1; }
    .tip-val { text-align: right; }
    .tip-pct { text-align: right; color: #94a3b8; }
    .tip-bar { height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden; }
    .tip-bar-fill { height: 100%; border-radius: 3px; }
    .tip-hint { margin-top: .45rem; font-size: .68rem; color: #64748b; }
    .tip-empty { font-size: .75rem; color: #94a3b8; }
    .tip-badge {
      font-size: .6rem; background: #f59e0b; color: #1c1917; padding: .05rem .25rem;
      border-radius: 3px; vertical-align: middle; font-weight: 700;
    }
    .tip-est { font-size: .72rem; color: #fbbf24; margin-bottom: .35rem; }
    .aviso-est {
      margin-top: .5rem; padding: .5rem .6rem; border-radius: 6px;
      background: #1c1917; border-left: 3px solid #f59e0b;
      font-size: .72rem; color: #fbbf24; line-height: 1.45;
    }
    .aviso-est b { color: #fde68a; }
    .chk-estimar {
      display: flex; align-items: center; gap: .4rem; margin: .1rem 0 .6rem;
      font-size: .78rem; color: #fbbf24; cursor: pointer;
    }
    .leaflet-tooltip.ruta-tip {
      background: #1c1917; border: 1px solid #b45309; color: #fbbf24;
      font-size: .72rem; font-weight: 600; padding: .15rem .4rem; border-radius: 4px;
      box-shadow: none;
    }
    .leaflet-tooltip.ruta-tip:before { display: none; }
  </style>
</head>
<body>
<header>
  <h1>⛽ Gasoil & Naftas — Provincias</h1>
  <nav>
    <a href="/" class="active">Mapa</a>
    <a href="/proyecciones">Proyecciones</a>
    {% if user.nivel >= 2 %}<a href="/admin">Admin</a>{% endif %}
    <a href="/logout">Salir ({{ user.nombre or user.email }})</a>
  </nav>
</header>
<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="panel">
      <h3>Filtros</h3>
      <label>Años</label>
      <div class="ms" id="msAnios"></div>
      <label>Meses</label>
      <div class="ms" id="msMeses"></div>
      <label>Productos</label>
      <div class="ms" id="msProductos"></div>
      <label>Petroleras</label>
      <div class="ms" id="msPetroleras"></div>
      <label>Sectores</label>
      <div class="ms" id="msSectores"></div>
      <label class="chk-estimar">
        <input type="checkbox" id="chkEstimar"> Estimar meses sin dato real
      </label>
      <button class="apply" onclick="cargarMapa()" style="margin-top:.4rem">Aplicar</button>
    </div>

    <div class="panel">
      <h3>Total filtrado</h3>
      <div class="stat" id="totalGeneral">—</div>
      <div class="stat-label">m³ (aprox.)</div>
      <div class="stat-label" id="sinDatos" style="display:none;color:#f87171;margin-top:.4rem"></div>
      <div class="aviso-est" id="avisoEstimado" style="display:none"></div>
    </div>

    <div class="panel prov-detail" id="provDetail">
      <h3 id="provName">—</h3>
      <div id="provStats"></div>
    </div>

    <div class="panel">
      <h3>Capas</h3>
      <label style="display:flex;align-items:center;gap:.4rem;color:#cbd5e1;font-size:.8rem;cursor:pointer">
        <input type="checkbox" id="chkRutas" checked> Rutas nacionales
      </label>
      <div id="rutasEstado" style="font-size:.7rem;color:#64748b;margin-top:.35rem">cargando…</div>
    </div>

    <div class="panel">
      <h3>Leyenda (intensidad)</h3>
      <div class="legend" id="legend"></div>
      <div class="legend-item" style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid #334155">
        <div style="width:14px;height:3px;background:#b45309;border-radius:2px"></div>
        Ruta nacional
      </div>
    </div>
  </div>
</div>

<script>
const map = L.map('map', { zoomControl: true }).setView([-38.5, -63.5], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OSM &copy; CARTO', maxZoom: 18
}).addTo(map);

// Pane propio para las rutas, por debajo de los circulos de volumen (overlayPane = 400)
map.createPane('rutasPane');
map.getPane('rutasPane').style.zIndex = 350;

let markersLayer = L.layerGroup().addTo(map);
let rutasLayer = null;
let currentData = {};

const COLORS = ['#0c4a6e','#0369a1','#0ea5e9','#38bdf8','#7dd3fc','#e0f2fe'];
const PRODUCTOS = ['GO2','GO3','N2','N3'];
const PROD_COLOR = { GO2: '#f59e0b', GO3: '#fb923c', N2: '#38bdf8', N3: '#a78bfa' };

async function cargarRutas() {
  const estado = document.getElementById('rutasEstado');
  try {
    const r = await fetch('/static/rutas_nacionales.geojson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const gj = await r.json();
    rutasLayer = L.geoJSON(gj, {
      pane: 'rutasPane',
      style: { color: '#b45309', weight: 1.2, opacity: 0.75 },
      onEachFeature: (f, layer) => {
        const ref = f.properties && f.properties.ref;
        if (ref) layer.bindTooltip(ref, { sticky: true, className: 'ruta-tip' });
        layer.on('mouseover', () => layer.setStyle({ color: '#fbbf24', weight: 2.5, opacity: 1 }));
        layer.on('mouseout',  () => layer.setStyle({ color: '#b45309', weight: 1.2, opacity: 0.75 }));
      }
    });
    if (document.getElementById('chkRutas').checked) rutasLayer.addTo(map);
    estado.textContent = gj.features.length + ' rutas — fuente OpenStreetMap (ODbL)';
  } catch (e) {
    // El mapa sigue siendo util sin las rutas: se avisa en vez de fallar en silencio.
    estado.textContent = 'No se pudieron cargar las rutas (' + e.message + ')';
    estado.style.color = '#f87171';
    document.getElementById('chkRutas').disabled = true;
  }
}

document.getElementById('chkRutas').addEventListener('change', (ev) => {
  if (!rutasLayer) return;
  if (ev.target.checked) rutasLayer.addTo(map); else map.removeLayer(rutasLayer);
});

function formatNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + ' M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + ' k';
  return n.toFixed(0);
}

const MESES_NOMBRE = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                      'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const filtros = {};

function escaparAttr(v) {
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Desplegable de multi-seleccion con "Seleccionar todo" / "Ninguno".
function crearMultiSelect(contenedorId, items, nombre) {
  const cont = document.getElementById(contenedorId);
  cont.innerHTML = `
    <button class="ms-btn" type="button">
      <span class="ms-sum"></span><span class="ms-car">▼</span>
    </button>
    <div class="ms-panel" hidden>
      <div class="ms-acts">
        <button type="button" data-acc="todos">Seleccionar todo</button>
        <button type="button" data-acc="ninguno">Ninguno</button>
      </div>
      <div class="ms-list"></div>
    </div>`;
  const btn   = cont.querySelector('.ms-btn');
  const sum   = cont.querySelector('.ms-sum');
  const panel = cont.querySelector('.ms-panel');
  const lista = cont.querySelector('.ms-list');

  lista.innerHTML = items.length
    ? items.map(it => `<label><input type="checkbox" value="${escaparAttr(it.valor)}"${
        it.marcado === false ? '' : ' checked'}> ${it.etiqueta}</label>`).join('')
    : `<div class="ms-vacio">Sin ${nombre} disponibles</div>`;

  const inputs = () => Array.from(lista.querySelectorAll('input'));
  const marcados = () => inputs().filter(i => i.checked);

  function actualizarResumen() {
    const total = inputs().length, n = marcados().length;
    sum.classList.toggle('parcial', n > 0 && n < total);
    sum.classList.toggle('vacio', total > 0 && n === 0);
    if (!total)            sum.textContent = '—';
    else if (n === total)  sum.textContent = `Todos (${total})`;
    else if (n === 0)      sum.textContent = 'Ninguno';
    else if (n === 1)      sum.textContent = marcados()[0].parentNode.textContent.trim();
    else                   sum.textContent = `${n} de ${total}`;
  }

  btn.addEventListener('click', () => {
    panel.hidden = !cont.classList.toggle('abierto');
  });
  lista.addEventListener('change', actualizarResumen);
  cont.querySelector('[data-acc="todos"]').addEventListener('click', () => {
    inputs().forEach(i => { i.checked = true; }); actualizarResumen();
  });
  cont.querySelector('[data-acc="ninguno"]').addEventListener('click', () => {
    inputs().forEach(i => { i.checked = false; }); actualizarResumen();
  });

  actualizarResumen();
  filtros[contenedorId] = { valores: () => marcados().map(i => i.value) };
  return filtros[contenedorId];
}

async function initFiltros() {
  const r = await fetch('/api/filtros');
  const d = await r.json();
  const simple = v => ({ valor: v, etiqueta: v });
  // Los anios futuros se ofrecen pero arrancan desmarcados: el mapa muestra
  // datos reales salvo que se pidan estimaciones explicitamente.
  const anios = (d.anios || []).map(simple).concat(
    (d.anios_futuros || []).map(a => ({ valor: a, etiqueta: a + ' (est.)', marcado: false })));
  crearMultiSelect('msAnios', anios, 'años');
  crearMultiSelect('msMeses',      (d.meses || []).map(m => ({ valor: m, etiqueta: MESES_NOMBRE[m-1] || m })), 'meses');
  crearMultiSelect('msProductos',  (d.productos || []).map(simple), 'productos');
  crearMultiSelect('msPetroleras', (d.petroleras || []).map(simple), 'petroleras');
  crearMultiSelect('msSectores',   (d.sectores || []).map(simple), 'sectores');
}

async function cargarMapa() {
  // Una lista vacia viaja como parametro vacio: el backend lo entiende como
  // "no seleccionaron nada" y devuelve cero, distinto de no filtrar.
  const params = new URLSearchParams({
    anios:      filtros.msAnios.valores().join(','),
    meses:      filtros.msMeses.valores().join(','),
    productos:  filtros.msProductos.valores().join(','),
    petroleras: filtros.msPetroleras.valores().join(','),
    sectores:   filtros.msSectores.valores().join(','),
  });
  if (document.getElementById('chkEstimar').checked) params.set('estimar', '1');

  const r = await fetch('/api/volumenes?' + params);
  const resp = await r.json();
  currentData = resp.provincias || {};
  const estimados = resp.estimados || [];

  markersLayer.clearLayers();
  let maxTotal = 0;
  let sumTotal = 0;
  Object.values(currentData).forEach(d => {
    if (d.total > maxTotal) maxTotal = d.total;
    sumTotal += d.total;
  });
  document.getElementById('totalGeneral').textContent = formatNum(sumTotal);

  // Con algun filtro en "Ninguno" no vuelve nada: conviene decir por que el
  // mapa quedo vacio en vez de mostrar un cero sin explicacion.
  const vacios = ['msAnios','msMeses','msProductos','msPetroleras','msSectores']
    .filter(k => filtros[k].valores().length === 0);
  const aviso = document.getElementById('sinDatos');
  if (!Object.keys(currentData).length) {
    aviso.style.display = 'block';
    if (vacios.length) {
      aviso.textContent = 'Sin datos: no hay nada seleccionado en ' + vacios.length + ' filtro(s).';
    } else if (!document.getElementById('chkEstimar').checked) {
      aviso.innerHTML = 'Sin datos reales para estos años. Marcá <b>Estimar meses sin dato real</b> para ver la estimación.';
    } else {
      aviso.textContent = 'Sin datos para esta combinación de filtros.';
    }
  } else {
    aviso.style.display = 'none';
  }

  const avisoEst = document.getElementById('avisoEstimado');
  const sumEst = Object.values(currentData).reduce((a, d) => a + (d.estimado || 0), 0);
  if (estimados.length) {
    const meses = estimados.map(e => e.pedido[0] + '-' + String(e.pedido[1]).padStart(2, '0'));
    avisoEst.style.display = 'block';
    avisoEst.innerHTML = `<b>${formatNum(sumEst)} m³ estimados</b> (${(sumEst / (sumTotal || 1) * 100).toFixed(0)}%
      del total). ${estimados.length} mes(es) sin dato real: ${meses.slice(0, 6).join(', ')}${
      meses.length > 6 ? ' y ' + (meses.length - 6) + ' mas' : ''}.
      Se estiman con el mismo mes del último año con dato.`;
  } else {
    avisoEst.style.display = 'none';
  }

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  COLORS.forEach((c, i) => {
    const from = (maxTotal * i / COLORS.length);
    const to = (maxTotal * (i+1) / COLORS.length);
    legend.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${formatNum(from)} – ${formatNum(to)}</div>`;
  });

  Object.entries(currentData).forEach(([prov, d]) => {
    if (!d.lat) return;
    const intensity = maxTotal > 0 ? d.total / maxTotal : 0;
    const colorIdx = Math.min(COLORS.length - 1, Math.floor(intensity * COLORS.length));
    const radius = 8 + intensity * 28;
    // Borde punteado ambar cuando el valor incluye meses estimados.
    const esEst = (d.estimado || 0) > 0;
    const circle = L.circleMarker([d.lat, d.lon], {
      radius, fillColor: COLORS[colorIdx],
      color: esEst ? '#f59e0b' : '#fff', weight: esEst ? 2 : 1,
      dashArray: esEst ? '4,3' : null,
      fillOpacity: esEst ? 0.6 : 0.85
    }).bindTooltip(tooltipProv(prov, d), {
      direction: 'top', className: 'prov-tip', opacity: 1, offset: [0, -4]
    });
    circle.on('click', () => showProv(prov, d));
    markersLayer.addLayer(circle);
  });
}

function tooltipProv(prov, d) {
  const total = d.total || 0;
  // El maximo por producto escala las barras; con total 0 no hay nada que desglosar.
  const max = Math.max(...PRODUCTOS.map(p => d[p] || 0));
  if (total <= 0 || max <= 0) {
    return `<div class="tip-title">${prov}</div>
            <div class="tip-empty">Sin volumen para estos filtros</div>`;
  }
  const filas = PRODUCTOS.map(p => {
    const v = d[p] || 0;
    const pct = (v / total * 100);
    return `<div class="tip-row">
      <span class="tip-name">${p}</span>
      <span class="tip-bar"><span class="tip-bar-fill"
        style="width:${(v / max * 100).toFixed(1)}%;background:${PROD_COLOR[p]}"></span></span>
      <span class="tip-val">${formatNum(v)}</span>
      <span class="tip-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');
  const est = d.estimado || 0;
  const marca = est > 0
    ? `<div class="tip-est">⚠ ${formatNum(est)} m³ estimados (${(est/total*100).toFixed(0)}%) — no son datos reales</div>`
    : '';
  return `<div class="tip-title">${prov}${est > 0 ? ' <span class="tip-badge">EST.</span>' : ''}</div>
          <div class="tip-total">Total ${formatNum(total)} m³</div>
          ${marca}
          ${filas}
          <div class="tip-hint">Clic para fijar el detalle</div>`;
}

function showProv(name, d) {
  const el = document.getElementById('provDetail');
  el.classList.add('visible');
  document.getElementById('provName').textContent = name;
  const max = Math.max(d.GO2, d.GO3, d.N2, d.N3, 1);
  document.getElementById('provStats').innerHTML = `
    <div class="stat">${formatNum(d.total)}</div>
    <div class="stat-label">Total m³</div>
    ${['GO2','GO3','N2','N3'].map(p => `
      <div style="margin-top:.5rem">
        <div style="display:flex;justify-content:space-between;font-size:.8rem">
          <span>${p}</span><span>${formatNum(d[p])}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${(d[p]/max*100).toFixed(0)}%"></div></div>
      </div>
    `).join('')}
  `;
}

cargarRutas();
initFiltros().then(cargarMapa);
</script>
</body>
</html>
